# configs/inception_time.yaml
model: inception_time
# core training
epochs: 5000
batch_size: 64
lr: 3e-4
weight_decay: 1e-4
grad_clip: 1.0
use_amp: false
num_workers: 4
pin_memory: true
# task
status_classes: [3, 4, 3, 4]
rul_weight: 1.0
status_weight: 1.0
# data
in_channels: 24
T: 6
# InceptionTime-specific
it_filters: 32
it_depth: 6
it_bottleneck: 32
it_kernels: [3, 5, 7]
# (fallback keys, not required for this backbone)
channels: [64, 32, 10]
temporal_kernel: [3, 3, 2]
dropout: 0.0
edge_importance: false
